name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Verify required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN — add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID — add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ "$missing" = "1" ]; then exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Astro app dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Astro site
        working-directory: apps/web
        env:
          PUBLIC_SITE_URL: https://mein.typ2-kompass.de
          # Apex Plausible site so the sales_page_view event lands in the same
          # funnel as the Next.js app's checkout/activation events.
          PUBLIC_PLAUSIBLE_DOMAIN: typ2-kompass.de
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=typ2-kompass-app --branch=main
