name: Migrate D1

# One-shot D1 schema migrator. Reuses the Cloudflare credentials already
# stored as Actions secrets for the Deploy workflow. Manual trigger only.
#
# Usage: Actions tab → "Migrate D1" → Run workflow → choose env (production).
# Each SQL file in drizzle/ is applied in lexical order. The CREATE TABLE IF
# NOT EXISTS / CREATE INDEX IF NOT EXISTS guards in those files make the run
# idempotent — re-running is safe.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which D1 binding to migrate"
        required: true
        default: "remote"
        type: choice
        options:
          - remote
          - local

jobs:
  migrate:
    name: Apply drizzle SQL to typ2-kompass-db
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" = "1" ]; then exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install --no-save wrangler@^4.95.0

      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          flag="--remote"
          if [ "$TARGET" = "local" ]; then flag="--local"; fi
          shopt -s nullglob
          files=( drizzle/*.sql )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No SQL files in drizzle/"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "::group::Apply $f ($flag)"
            npx wrangler d1 execute typ2-kompass-db "$flag" --file="$f"
            echo "::endgroup::"
          done

      - name: List tables (sanity check)
        if: inputs.target == 'remote'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute typ2-kompass-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
