name = "typ2-kompass"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# D1 database binding for auth (users, sessions, consent, module progress).
# The same binding is also configured in the Cloudflare Pages dashboard
# (Settings → Functions → D1 database bindings) so Pages runtime picks it up.
[[d1_databases]]
binding = "DB"
database_name = "typ2-kompass-db"
database_id = "587212db-5e49-4f5c-8975-4498cb1a1bf8"
